# Quota ledger: one table per provider, keyed as profiles' `provider`. route.py reads it to send
# fungible tickets to the subscription furthest behind its pace.
#
# scripts/quota_read.py rewrites the providers it can read, from what each provider itself reports:
# anthropic (Claude Code's login) and openai (pi's openai-codex login). Every other provider is read
# by hand, never estimated, and refreshed at least every routing.stale_hours; a stale or missing
# reading counts as on pace.
#   period_start  any past start of the provider's quota period (its weekly reset), UTC
#   period_days   length of that period
#   used          fraction of the period's allowance used, 0.0 to 1.0
#   read_at       when it was read, UTC
#
# <!-- ESTATE: where to read each hand-read provider, e.g. xai: the usage page at grok.com for the
#      SuperGrok account pi uses. -->

[anthropic]
period_start = "2026-09-28T00:00Z"
period_days = 7
used = 0.0
read_at = "2026-01-01T00:00Z"

[openai]
period_start = "2026-09-28T00:00Z"
period_days = 7
used = 0.0
read_at = "2026-01-01T00:00Z"

[xai]
period_start = "2026-09-28T00:00Z"
